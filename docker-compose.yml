version: '3.8'

services:
  # The Web Server / Control Panel
  web:
    build: .
    container_name: outbound-caller-web
    command: python web_server.py
    ports:
      - "5000:5000"
    volumes:
      - .:/app  # Mount current dir for live editing (remove in production)
      - ./data:/app/data
    env_file:
      - .env.local
    restart: unless-stopped
    # In production, web server triggers background tasks via API/Queue
    # For this setup, it spawns subprocesses, which works inside the container
    # if the container has enough permissions/resources.

  # The Agent (The Worker)
  # This runs the agent continuously, checking for job assignments
  agent:
    build: .
    container_name: outbound-caller-agent
    command: python agent.py dev
    volumes:
      - .:/app
    env_file:
      - .env.local
    restart: unless-stopped
    depends_on:
      - web
    # Agent needs access to audio devices if testing locally, 
    # but for Cloud dispatching, it just processes streams.

  # Optional: Redis (if you upgrade to using Celery/Task Queue later)
  # redis:
  #   image: redis:alpine
